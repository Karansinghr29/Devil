<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#07040d" />
<meta name="description" content="A little surprise." />
<!-- the page is public, but keep it out of Google -->
<meta name="robots" content="noindex, nofollow" />
<title>For You</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@300;400;500;600&family=Noto+Sans+Tamil:wght@300;400;500&family=Great+Vibes&display=swap"
  rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9D%A4%EF%B8%8F</text></svg>" />
</head>

<body class="is-locked">

  <!-- persistent animated atmosphere: hearts, infinity, sparkles -->
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob aurora__blob--a"></span>
    <span class="aurora__blob aurora__blob--b"></span>
    <span class="aurora__blob aurora__blob--c"></span>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ============ STAGE 1 : OPENING / BALLOONS ============ -->
  <div id="gate" class="gate">
    <div class="gate__inner">
      <p class="gate__eyebrow" id="gateEyebrow"></p>
      <div class="balloons" id="balloons"></div>
      <p class="gate__hint" id="gateHint"><span></span></p>
    </div>
  </div>

  <!-- ============ STAGE 2 : THE STORY ============ -->
  <main id="story" class="story" aria-hidden="true">

    <!-- 1. birthday reveal -->
    <section class="panel panel--center" id="sec-reveal">
      <div class="panel__body">
        <div class="reveal-halo" aria-hidden="true"></div>
        <h1 class="bday reveal-item" data-d="0">
          <span class="bday__l1">Happy Birthday,</span>
          <span class="bday__l2">My Life <em>❤</em></span>
        </h1>
        <p class="bday__msg reveal-item" data-d="1" id="revealMsg"></p>
      </div>
      <button class="cue" data-next="#sec-memories" aria-label="Continue">
        <span>keep going</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 2. memories -->
    <section class="panel" id="sec-memories">
      <div class="panel__body">
        <h2 class="eyebrow reveal-item" data-d="0" id="memTitle"></h2>
        <p class="lead reveal-item" data-d="1" id="memSub"></p>
        <div class="gallery" id="gallery"></div>
      </div>
      <button class="cue" data-next="#sec-unspoken" aria-label="Continue">
        <span>there's more</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 3. unspoken love -->
    <section class="panel panel--center" id="sec-unspoken">
      <div class="panel__body">
        <h2 class="eyebrow reveal-item" data-d="0" id="unTitle"></h2>
        <div class="whisper" id="unLines"></div>
        <p class="bridge reveal-item" id="unBridge"></p>
      </div>
      <button class="cue" data-next="#sec-poem" aria-label="Continue">
        <span>read it</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 4. tamil poem -->
    <section class="panel" id="sec-poem">
      <div class="panel__body">
        <p class="eyebrow reveal-item" data-d="0" id="poemIntro"></p>
        <article class="card card--paper reveal-item" data-d="1">
          <h2 class="poem__title" id="poemTitle"></h2>
          <div class="poem" id="poemBody"></div>
          <p class="poem__sig" id="poemSig"></p>
        </article>
      </div>
      <button class="cue" data-next="#sec-song" aria-label="Continue">
        <span>then, this song</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 5. the song -->
    <section class="panel panel--center" id="sec-song">
      <div class="panel__body">
        <h2 class="song-head reveal-item" data-d="0" id="songHead"></h2>
        <p class="lead lead--sm reveal-item" data-d="1" id="songNote"></p>

        <div class="player reveal-item" data-d="2" id="player">
          <div class="player__art" id="art">
            <div class="art__fallback" aria-hidden="true"><span>∞</span></div>
            <div class="art__ring" aria-hidden="true"></div>
          </div>

          <div class="player__meta">
            <h3 id="songTitle"></h3>
            <p id="songSub"></p>
            <p class="credit" id="songCredit"></p>
          </div>

          <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

          <div class="player__bar">
            <div class="seek" id="seek" role="slider" tabindex="0"
                 aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="seek__fill" id="seekFill"></div>
              <div class="seek__knob" id="seekKnob"></div>
            </div>
            <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
          </div>

          <button class="play" id="playBtn" aria-label="Play song">
            <svg class="ic ic--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
            <svg class="ic ic--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
          </button>
          <p class="player__err" id="playerErr" hidden></p>
        </div>
      </div>
      <button class="cue" data-next="#sec-letter" aria-label="Continue">
        <span>one more thing</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 6. personal letter -->
    <section class="panel" id="sec-letter">
      <div class="panel__body">
        <p class="eyebrow reveal-item" data-d="0" id="letterHead"></p>
        <article class="card card--letter reveal-item" data-d="1" id="letterCard">
          <p class="letter__greet" id="letterGreet"></p>
          <div class="letter__body" id="letterBody"></div>
          <p class="letter__sign" id="letterSign"></p>
          <button class="skip" id="skipType" hidden>tap to show it all</button>
        </article>
      </div>
      <button class="cue" data-next="#sec-final" aria-label="Continue">
        <span>almost there</span><i class="cue__chev"></i>
      </button>
    </section>

    <!-- 7. finale -->
    <section class="panel panel--center panel--final" id="sec-final">
      <div class="panel__body">
        <div class="final" id="finalLines"></div>
        <div class="final__symbol reveal-item" id="finalSymbol"></div>
        <p class="final__closing reveal-item" id="finalClosing"></p>
        <button class="replay" id="replay"></button>
      </div>
    </section>

  </main>

  <audio id="audio" preload="metadata" playsinline></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
